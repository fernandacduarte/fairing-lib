name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SuiteSparse (needed to build scikit-sparse / CHOLMOD)
        run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
